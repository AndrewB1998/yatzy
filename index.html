function hideChat(now){
  const sh=$('#chat-sheet'); if(sh.hidden)return;
  sh.classList.remove('on'); $('#chat-in').blur();
  if(now)sh.hidden=true; else setTimeout(()=>{sh.hidden=true;},220);
}
function sendChat(){
  const inp=$('#chat-in'), v=cleanChat(inp.value);
  if(!v||!st.room||Date.now()-st.chatLast<500)return;
  st.chatLast=Date.now();
  const m={i:++st.chatSeq,t:v,ts:Date.now()};
  st.chatMine.push(m); if(st.chatMine.length>20)st.chatMine.shift();
  st.chat.set(st.myKey+':'+m.i,{n:myName(),t:v,ts:m.ts,me:true});
  st.room.presence({ch:JSON.stringify(st.chatMine)}).catch(()=>{});
  inp.value=''; renderChat();
}
$('#g-chat').addEventListener('click',showChat);
$('#g-chat-peek').addEventListener('click',showChat);
$('#l-chat').addEventListener('click',showChat);
$('#e-chat').addEventListener('click',showChat);
$('#chat-close').addEventListener('click',()=>hideChat());
$('#chat-x').addEventListener('click',()=>hideChat());
// iPhone's keyboard ✓ just removes focus from the message box: close the chat too,
// unless the focus loss came from a tap inside the chat (Send, sound, scrolling...)
let chatTouchT=0;
$('#chat-sheet').addEventListener('pointerdown',()=>{chatTouchT=Date.now();},true);
$('#chat-in').addEventListener('blur',()=>{setTimeout(()=>{
  if($('#chat-sheet').hidden||document.activeElement===$('#chat-in')||Date.now()-chatTouchT<500)return;
  hideChat();
},120);});
$('#chat-send').addEventListener('click',()=>{sendChat();const i=$('#chat-in');if(document.activeElement!==i){try{i.focus({preventScroll:true});}catch(e){i.focus();}}});
// tapping Send must not take focus from the message box, or the keyboard would close
['mousedown','pointerdown'].forEach(ev=>$('#chat-send').addEventListener(ev,e=>e.preventDefault()));
$('#chat-in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();sendChat();}});
$('#chat-sheet').addEventListener('click',e=>{if(e.target===e.currentTarget)hideChat();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#chat-sheet').hidden)hideChat();});
renderChatBadge();

$('#e-cards').addEventListener('click',showCards);

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=set.lang;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t);});
  document.querySelectorAll('[data-ta]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.ta));});
  document.querySelectorAll('[data-tp]').forEach(el=>{el.placeholder=t(el.dataset.tp);});
  rows.forEach((r,c)=>{r.nm.textContent=cat(c);});
  buildRules();
  if(!st.busy)setBusy(false);
  go(cur);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-act]'); if(!el)return;
  if(el.dataset.go){if(el.dataset.go==='mp')mpErr('');go(el.dataset.go);}
  else if(el.dataset.act==='solo')startSolo();
  else if(el.dataset.act==='bot')startBot();
});
$('#b-roll').addEventListener('click',doRoll);
$('#b-score').addEventListener('click',()=>{if(gmOf(st.g)==='kivi'){if(st.ksel!=null&&st.kmove==null)doKivi(st.ksel);}else if(st.sel!=null)doScore(st.sel);});
function toggleMute(){if(set.vol===0){set.vol=60;set.mute=false;}else set.mute=!set.mute;saveSet();renderMute();if(!set.mute)sfx.tick();}
$('#g-mute').addEventListener('click',toggleMute);
$('#chat-mute').addEventListener('click',toggleMute);
$('#g-players').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b||!st.g)return;
  const g=st.g,i=+b.dataset.i,p=g.pl[i]; if(!p)return;
  if(st.mode==='host'&&g.ph==='play'&&b.classList.contains('away')&&i>0){
    ask({title:t('removeQ',p.n),text:t('removeT'),yes:t('remove'),no:t('wait')})
      .then(ok=>{if(ok&&st.g===g&&g.pl[i]===p&&removePlayer(g,i))commit();});
    return;
  }
  st.viewHold=null; st.viewIdx=(i===g.t||st.viewIdx===i)?null:i; renderGame();
});
$('#g-exit').addEventListener('click',async()=>{
  if(st.mode==='solo'){teardown();go('menu');return;}
  if(st.mode==='host'){if(await ask({title:t('endQ'),text:t('endT'),yes:t('endGame'),no:t('keepPlaying')}))closeHosting();return;}
  if(st.mode==='guest'){if(await ask({title:t('leaveQ'),text:t('leaveT'),yes:t('leave'),no:t('stay')}))leaveGuest();}
});
$('#l-back').addEventListener('click',async()=>{
  if(st.mode==='host'){if(await ask({title:t('closeQ'),text:t('closeT'),yes:t('closeGame'),no:t('stay')}))closeHosting();}
  else leaveGuest();
});
$('#l-start').addEventListener('click',toggleReady);
$('#l-rules').addEventListener('click',()=>{const g=st.g;st.rulesTab=g&&MODES[g.gs]?g.gs:'yatzy';st.rulesFrom='lobby';buildRules();go('rules');});
$('#r-back').addEventListener('click',()=>{if(st.rulesFrom){st.rulesFrom=null;route();}else go('menu');});
$('#l-gms').addEventListener('click',e=>{
  const b=e.target.closest('button'), g=st.g; if(!b||st.mode!=='host'||!g||g.ph!=='lobby')return;
  g.gs=b.dataset.g; store.set('yz.gs',g.gs); commit();
});
$('#l-mf').addEventListener('click',e=>{
  const b=e.target.closest('button'), g=st.g; if(!b||st.mode!=='host'||!g||g.ph!=='lobby')return;
  if(b.dataset.n==='c'){st.mfCustom=true;if([1,2,3].includes(g.mf||1))g.mf=4;}else{st.mfCustom=false;g.mf=+b.dataset.n;}
  store.set('yz.mf',g.mf); commit();
});
function stepMf(d){const g=st.g;if(st.mode!=='host'||!g||g.ph!=='lobby')return;g.mf=Math.max(1,Math.min(9,(g.mf||4)+d));store.set('yz.mf',g.mf);commit();}
$('#l-mf-dn').addEventListener('click',()=>stepMf(-1));
$('#l-mf-up').addEventListener('click',()=>stepMf(1));
$('#l-copy').addEventListener('click',async()=>{
  const link=location.origin+location.pathname+'#join-'+st.code;
  try{await navigator.clipboard.writeText(link);toast(t('copied'));}catch(e){toast(t('yourCode',st.code));}
});
$('#e-again').addEventListener('click',()=>{if(st.mode==='solo')startSolo();else toggleReady();});
$('#e-menu').addEventListener('click',()=>{if(st.mode==='solo'){teardown();go('menu');}else if(st.mode==='host')closeHosting();else leaveGuest();});

$('#mp-host').addEventListener('click',()=>hostGame(null));
$('#mp-join').addEventListener('click',()=>joinGame($('#mp-code').value));
$('#mp-code').addEventListener('input',e=>{const v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);if(e.target.value!==v)e.target.value=v;mpErr('');});
$('#mp-code').addEventListener('keydown',e=>{if(e.key==='Enter')joinGame(e.target.value);});
function onName(e){set.name=e.target.value.slice(0,16);saveSet();}
$('#mp-name').addEventListener('input',onName);
$('#set-name').addEventListener('input',onName);
$('#set-vol').addEventListener('input',e=>{set.vol=+e.target.value;if(set.vol>0)set.mute=false;$('#set-vol-v').textContent=set.vol;saveSet();});
$('#set-vol').addEventListener('change',()=>sfx.tick());
$('#set-theme').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;set.theme=b.dataset.v;saveSet();applyTheme();renderSettings();});
$('#set-hints').addEventListener('change',e=>{set.hints=e.target.checked;saveSet();});
$('#set-spots').addEventListener('change',e=>{set.spots=e.target.checked;saveSet();});
$('#set-lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.v===set.lang)return;set.lang=b.dataset.v;saveSet();applyLang();});
$('#set-table').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;set.table=b.dataset.v;saveSet();applyTheme();renderSettings();});
$('#st-reset').addEventListener('click',async()=>{if(await ask({title:t('resetQ'),text:t('resetT'),yes:t('reset'),no:t('cancel')})){store.del('yz.stats');store.del('yz.best');renderStats();}});

function applyTheme(){const r=document.documentElement;if(set.theme==='light'||set.theme==='dark')r.setAttribute('data-app-theme',set.theme);else r.removeAttribute('data-app-theme');r.setAttribute('data-table',set.table);}

/* ---------- init ---------- */
applyTheme();
applyLang();
document.querySelectorAll('.screen').forEach(s=>{if(!s.classList.contains('on'))s.inert=true;});
roomP.then(r=>{if(!r){st.noOnline=true;if(cur==='mp')renderMp();}});
const hm=/^#join-([a-z0-9]{5})$/i.exec(location.hash||'');
if(hm&&CODE_RE.test(hm[1].toUpperCase())){st.prefill=hm[1].toUpperCase();go('mp');}
else renderMenu();
})();
</script>
</body>
</html>
