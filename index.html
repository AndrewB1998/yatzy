<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, set, get, update, onValue, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Paste your Firebase web config here (Firebase console → Project settings → Your apps)
  const firebaseConfig = {
    apiKey: "AIzaSyDaMwO2WFqF0NB6CZRym8tbnNoEUWePiQM",
    authDomain: "yatzy-2d192.firebaseapp.com",
    databaseURL: "https://yatzy-2d192-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "yatzy-2d192",
    storageBucket: "yatzy-2d192.firebasestorage.app",
    messagingSenderId: "662487185156",
    appId: "1:662487185156:web:a3946945e6ecd7c66cc251"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const activeJoins = {};

  // Secure Anonymous Authentication
  window.authReady = new Promise((resolve) => {
    let settled = false;
    const done = (u) => { if (!settled) { settled = true; resolve(u); } };
    // Safety net: never leave the UI hanging on "Connecting…"
    const timer = setTimeout(() => {
      console.error("[Yatzy] auth timed out — multiplayer disabled");
      done(null);
    }, 10000);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        clearTimeout(timer);
        done(user);
      } else {
        signInAnonymously(auth).catch((error) => {
          console.error("[Yatzy] anonymous sign-in failed:", error.code || error);
          clearTimeout(timer);
          done(null); // settle so the app shows its notice instead of freezing
        });
      }
    });
  });

  window.YatzyDB = {
    async getUser() {
      const user = await window.authReady;
      if (!user) return null;
      return { id: async () => user.uid };
    },
    async getRoom() {
      const user = await window.authReady;
      if (!user) return null;
      return {
        async join(roomName) {
          const path = 'rooms/' + roomName + '/peers/' + user.uid;
          const roomRef = ref(db, 'rooms/' + roomName);
          const peerRef = ref(db, path);
          const connectedRef = ref(db, '.info/connected');
          const token = {};
          activeJoins[path] = token;            // newest join of this path owns it
          let isConnected = false, left = false;
          const mine = {};                       // full copy of my presence
          const unsubs = [], connCbs = [];
          const writeFull = () => set(peerRef, { ...mine, by: user.uid, ts: Date.now() });

          // On every (re)connect: re-arm onDisconnect and re-write presence.
          // onDisconnect fires once and is gone, so after an iPhone sleeps or
          // the network drops, our peer node would otherwise stay deleted.
          unsubs.push(onValue(connectedRef, (snap) => {
            isConnected = !!snap.val();
            connCbs.forEach((cb) => { try { cb(isConnected); } catch (e) {} });
            if (isConnected && !left) {
              onDisconnect(peerRef).remove()
                .then(() => { if (!left && Object.keys(mine).length) return writeFull(); })
                .catch((e) => console.error("[Yatzy] presence error:", e.code || e));
            }
          }));

          return {
            connected() { return isConnected; },
            onConnection(cb) { connCbs.push(cb); },
            async presence(data) {
              for (const k in data) { if (data[k] === null) delete mine[k]; else mine[k] = data[k]; }
              if (left) return;
              await update(peerRef, { ...data, by: user.uid, ts: Date.now() });
            },
            onPeers(callback, disconnectCb) {
              unsubs.push(onValue(roomRef, (snapshot) => {
                const val = snapshot.val() || {};
                const peersMap = val.peers || {};
                const peers = Object.keys(peersMap).map((uid) => ({ by: uid, isMe: uid === user.uid, presence: peersMap[uid] }));
                callback({ peers });
              }, (error) => {
                console.error("[Yatzy] room read error:", error.code || error);
                if (disconnectCb) disconnectCb(error);
              }));
            },
            async leave() {
              if (left) return;
              left = true;
              unsubs.forEach((u) => { try { u(); } catch (e) {} });
              unsubs.length = 0; connCbs.length = 0;
              // Don't wipe the node if a newer join (e.g. quick rejoin) now owns it.
              if (activeJoins[path] !== token) return;
              delete activeJoins[path];
              try { await onDisconnect(peerRef).cancel(); } catch (e) {}
              await remove(peerRef);
            }
          };
        }
      };
    }
  };
</script>

<style>
:root{
  --bg:#E7EBEF; --surface:#FFFFFF; --surface-2:#F1F4F7; --line:#D8DEE5; --ink:#172029; --muted:#667283;
  --accent:#2445AE; --accent-ink:#FFFFFF; --accent-soft:#E1E8FB; --danger:#B8324A;
  --tray:#1C2944; --held:#A9BCFF;
  --die-base:#FBFAF7; --die-edge:#DCD9D2; --pip-base:#1A1D23;
  --r-lg:22px; --r-md:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-app-theme="light"]){
    --bg:#13171D; --surface:#1C2129; --surface-2:#232932; --line:#2E3540; --ink:#E7EBF0; --muted:#8B95A3;
    --accent:#91A8FF; --accent-ink:#0D1630; --accent-soft:#252F4E; --danger:#FF8A9C;
    --tray:#1A2440; --die-base:#F3F2EE; --die-edge:#CFCCC5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-app-theme="light"]), :root[data-app-theme="dark"]{
  --bg:#13171D; --surface:#1C2129; --surface-2:#232932; --line:#2E3540; --ink:#E7EBF0; --muted:#8B95A3;
  --accent:#91A8FF; --accent-ink:#0D1630; --accent-soft:#252F4E; --danger:#FF8A9C;
  --tray:#1A2440; --die-base:#F3F2EE; --die-edge:#CFCCC5;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background-color .25s}
input{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

#app{position:relative;height:100%;max-width:520px;margin:0 auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:8px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .22s ease,transform .22s ease,visibility 0s linear .22s}
.screen.on{opacity:1;visibility:visible;transform:none;transition:opacity .22s ease,transform .22s ease}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:2px 16px 16px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-md);padding:15px 18px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,background-color .2s,opacity .2s,color .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:active{transform:none}
.btn.full{width:100%}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:12px;color:var(--ink);padding:0}
.icon-btn:active{background:var(--surface-2)}
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:52px;margin-bottom:6px}
.bar h2{margin:0;text-align:center;font-size:19px;font-weight:800;letter-spacing:-.01em}

/* dice */
.die{position:absolute;left:0;top:0;width:var(--ds);height:var(--ds);margin:calc(var(--ds)/-2) 0 0 calc(var(--ds)/-2);padding:0;border:0;background:none;border-radius:17%;will-change:transform}
.die:disabled{cursor:default}
.dshadow{position:absolute;inset:7%;border-radius:20%;background:rgba(0,0,0,.42);box-shadow:0 0 calc(var(--ds)*.1) calc(var(--ds)*.03) rgba(0,0,0,.38);transform:translate(1.5px,2.5px)}
.lift{position:absolute;inset:0}
.d3{position:absolute;inset:0;perspective:calc(var(--ds)*7)}
.cube{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:17%;overflow:hidden;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;
  background:radial-gradient(150% 150% at 24% 16%,#FFFFFF 0%,#FBFAF6 34%,#E4E0D5 100%);
  box-shadow:inset 0 0 0 1px rgba(60,45,20,.07),inset 0 calc(var(--ds)*-.055) calc(var(--ds)*.09) rgba(80,62,30,.22);
  -webkit-backface-visibility:hidden;backface-visibility:hidden}
.face::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--sp,1);
  background:radial-gradient(circle at 12% 9%,rgba(255,255,255,1) 0,rgba(255,255,255,0) 6%),radial-gradient(62% 15% at 40% 5%,rgba(255,255,255,.85),rgba(255,255,255,0) 78%),linear-gradient(135deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 30%)}
.face::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:#141A2B;opacity:var(--sh,0)}
.pip{width:76%;height:76%;place-self:center;border-radius:50%;background:#15171C}
.face .pip{background:radial-gradient(circle at 60% 68%,#474C57 0%,#1A1C22 55%,#0E0F12 100%);box-shadow:0 calc(var(--ds)*.012) 0 rgba(255,255,255,.95)}
.f1{transform:translateZ(calc(var(--ds)/2))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--ds)/2))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--ds)/2))}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--ds)/2))}
.f2{transform:rotateX(90deg) translateZ(calc(var(--ds)/2))}
.f5{transform:rotateX(-90deg) translateZ(calc(var(--ds)/2))}
.lift::after{content:"";position:absolute;inset:0;border-radius:17%;background:var(--table-base,var(--tray));opacity:0;transition:opacity .3s;pointer-events:none}
.tray.idle .lift::after{opacity:.5}
@keyframes wob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-3px) rotate(4deg)}}
.tray.pending .die:not(.kept) .d3{animation:wob .16s ease-in-out infinite alternate}
.tray{position:relative;flex:none;background:var(--table-bg,var(--tray));border-radius:22px;box-shadow:inset 0 2px 10px rgba(0,0,0,.35);--ds:clamp(40px,12vw,52px);height:calc(var(--ds)*1.84 + 50px);overflow:hidden;transition:height .4s cubic-bezier(.215,.61,.355,1)}
.tray.last{height:calc(var(--ds) + 28px)}
.shelf{position:absolute;left:8px;right:8px;top:6px;height:calc(var(--ds)*.84 + 8px);border-radius:16px;background:rgba(255,255,255,.05);display:grid;grid-template-columns:repeat(5,1fr);place-items:center;transition:opacity .4s ease}
.tray.last .shelf{opacity:0;transition-duration:.2s}
.slot{width:calc(var(--ds)*.84);height:calc(var(--ds)*.84);border-radius:17%;border:1.5px dashed rgba(255,255,255,.13);transition:opacity .2s}
.shelf-hint{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.6);font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none}
.tray.hint .shelf-hint{opacity:1}
.tray.hint .slot{opacity:0}
.glow{position:absolute;inset:-22%;border-radius:40%;background:radial-gradient(closest-side,rgba(169,188,255,.7),rgba(169,188,255,.26) 62%,rgba(169,188,255,0));opacity:0;transition:opacity .5s ease;pointer-events:none}
.die.combo .glow{opacity:1}
.tray::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.22) 50%,rgba(255,255,255,0) 65%);transform:translateX(-110%)}
.tray.cele::after{animation:sweep 1s cubic-bezier(.3,.6,.3,1)}
@keyframes sweep{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
.tray.cele{box-shadow:inset 0 2px 10px rgba(0,0,0,.35),0 0 0 2px rgba(169,188,255,.55),0 0 26px rgba(169,188,255,.4)}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.bit{position:absolute;width:7px;height:7px;border-radius:2px;animation:bit var(--t,1.1s) cubic-bezier(.2,.7,.3,1) forwards}
@keyframes bit{0%{transform:translate(0,0) rotate(0);opacity:1}55%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:1}100%{transform:translate(calc(var(--dx)*1.3),calc(var(--dy) + 60px)) rotate(calc(var(--rot)*1.6));opacity:0}}

.mini{display:inline-grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:20px;height:20px;padding:3px;border-radius:5.5px;box-shadow:inset 0 0 0 1.6px currentColor;flex:none;color:var(--ink)}
.mini .pip{width:3.6px;height:3.6px;background:currentColor}

/* menu */
#s-menu{justify-content:space-between;padding-bottom:20px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:0}
.hero h1{margin:0;font-size:clamp(52px,16vw,72px);font-weight:800;letter-spacing:-.05em;line-height:.9}
.menu-tray{position:relative;--ds:40px;width:calc(var(--ds)*5 + 76px);height:calc(var(--ds) + 30px);background:var(--table-bg,var(--tray));border-radius:20px;box-shadow:inset 0 2px 10px rgba(0,0,0,.35)}
.menu{display:grid;gap:10px}
.mbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:16px 20px;transition:transform .12s}
.mbtn:active{transform:scale(.985)}
.mbtn > span{font-size:19px;font-weight:800;letter-spacing:-.01em}
.mbtn small{font-size:14px;font-weight:600;color:var(--muted)}
.mbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mbtn.primary small{color:inherit;opacity:.78}
.mbtn.resume{border:1.5px solid var(--accent)}
.mrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mbtn.sm{align-items:center;padding:15px;border-radius:var(--r-md)}
.mbtn.sm > span{font-size:16px;font-weight:700}
#m-resume{display:grid;gap:10px}
#m-resume:empty{display:none}

/* settings & forms */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:14px;overflow:hidden}
.field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;min-height:56px;font-size:16px;font-weight:700;width:100%;border:0;background:none;text-align:left;color:var(--ink)}
.field + .field{border-top:1px solid var(--line)}
.field small{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.field .txt{flex:1;min-width:0;text-align:right;border:0;background:none;font:inherit;font-size:16px;font-weight:600;color:var(--ink);padding:6px 0;outline-offset:4px}
.field .txt::placeholder{color:var(--muted);opacity:.7}
.vol{display:flex;align-items:center;gap:10px;color:var(--muted)}
.vol input{accent-color:var(--accent);width:min(40vw,170px);margin:0}
.vol output{font-size:14px;font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.switch{-webkit-appearance:none;appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background-color .2s;margin:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}
.field.link{cursor:pointer;color:var(--danger)}
.note{color:var(--muted);font-size:14px;line-height:1.45;margin:4px 4px 0;font-weight:500}

/* multiplayer */
.mp-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-top:14px}
.mp-block h3{margin:0 0 4px;font-size:18px;font-weight:800}
.mp-block .muted{margin:0 0 14px}
.muted{color:var(--muted);font-size:15px;line-height:1.45;font-weight:500}
.join-row{display:flex;gap:10px}
.code-in{flex:1;min-width:0;font:inherit;font-size:24px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:11px 4px 11px calc(4px + .3em);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);color:var(--ink)}
.code-in::placeholder{color:var(--muted);opacity:.4}
.err{color:var(--danger);font-size:14px;font-weight:600;margin:10px 2px 0;line-height:1.4}
.err:empty{display:none}
.notice{background:var(--accent-soft);border-radius:var(--r-md);padding:14px 16px;font-size:15px;line-height:1.45;margin:0 0 14px;font-weight:600}

/* lobby */
.code-card{background:var(--table-bg,var(--tray));color:#fff;border-radius:var(--r-lg);padding:22px 20px 20px;text-align:center;display:grid;gap:8px;justify-items:center;margin-top:4px}
.code-card .cl{color:rgba(255,255,255,.62);font-size:14px;font-weight:600}
.code{font-size:46px;font-weight:800;letter-spacing:.16em;padding-left:.16em;line-height:1.1;font-variant-numeric:tabular-nums}
.code-card .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff;font-size:15px;padding:10px 18px;margin-top:6px}
.status{color:var(--muted);text-align:center;margin:18px 12px;font-size:15px;line-height:1.45;font-weight:600}
.plist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.plist li{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:700;font-size:16px;gap:12px}
.plist li + li{border-top:1px solid var(--line)}
.plist li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .tag{font-size:13px;color:var(--muted);font-weight:700;flex:none}

/* game */
.gbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:50px}
.gtitle{text-align:center;min-width:0}
#g-turn{font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#g-round{font-size:13px;color:var(--muted);font-weight:600;margin-top:1px}
#g-round:empty{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 10px;font-size:14px;font-weight:700;max-width:46vw;transition:background-color .2s,border-color .2s,opacity .2s}
.chip span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;transition:background-color .2s}
.chip.active{border-color:var(--accent)}
.chip.active .dot{background:var(--accent)}
.chip.viewing{background:var(--accent-soft)}
.chip.away{opacity:.5}
.chip b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}

.pad{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:auto;margin:8px 0 10px;-webkit-overflow-scrolling:touch}
.col{display:grid;grid-template-rows:repeat(9,minmax(36px,1fr))}
.col + .col{border-left:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 10px 0 11px;border:0;border-top:1px solid var(--line);background:color-mix(in srgb, var(--surface) 96%, var(--ink) 4%);text-align:left;font-size:clamp(13.5px,3.85vw,15.5px);font-weight:600;min-width:0;color:var(--ink);transition:background-color .35s ease,box-shadow .2s ease}
.col > .row:first-child{border-top:0}
.row:disabled{cursor:default;color:var(--ink);opacity:1}
.row .lbl{display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;min-width:0}
.row .lbl > span{overflow:hidden;text-overflow:ellipsis}
.row .mini{opacity:.72}
.row .val{font-variant-numeric:tabular-nums;font-size:17px;min-width:26px;text-align:right;flex:none}

/* LOCKED / FILLED ROWS STYLING */
.row.filled{background:var(--surface-2);opacity:0.75}
.row.filled .lbl{opacity:0.6}
.row.filled .val{font-weight:700;color:var(--muted)}

.row.hint .val{color:var(--muted);font-weight:600}
.row.hint.zero .val{opacity:.45}
.row:not(:disabled):active{background:var(--surface-2)}
.row.fit{background:var(--accent-soft);background:color-mix(in srgb,var(--accent-soft) 72%,transparent);transition-delay:calc(var(--i,0)*40ms)}
.row.fit .val{color:var(--accent);font-weight:800}
@keyframes spotIn{0%{background-color:rgba(0,0,0,0)}35%{background-color:var(--accent-soft)}100%{background-color:color-mix(in srgb,var(--accent-soft) 60%,transparent)}}
.row.spot{background:color-mix(in srgb,var(--accent-soft) 60%,transparent);animation:spotIn .9s ease-out}
.row.spot .val{color:var(--accent);font-weight:800}
.row.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.row.sel .val,.row.sel.hint.zero .val{color:var(--accent);font-weight:800;opacity:1}
.row.sum{background:var(--surface-2);font-size:14px;color:var(--muted)}
.row.sum .val{font-size:15px;color:var(--muted);font-weight:600}
.row.sum .val b{color:var(--ink);font-weight:800}
.row.sum .val.earned{color:var(--accent);font-weight:800}
.row.sum .val.pend{font-size:13px}
.row.total{color:var(--ink);font-weight:800}
.row.total .val{color:var(--ink);font-weight:800;font-size:18px}
@keyframes ink{0%{background:var(--accent-soft)}100%{background:rgba(0,0,0,0)}}
@keyframes inkv{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.row.ink{animation:ink 1.1s ease-out}
.row.ink .val{animation:inkv .45s ease-out}

.actions{display:flex;gap:10px;margin-top:10px;flex:none}
#b-roll{flex:1;padding:16px;font-size:18px}
#b-score{flex:1.25;display:none}
.actions.choosing #b-score{display:inline-flex}
.actions.choosing #b-roll{background:var(--surface);border-color:var(--line);color:var(--ink)}
.actions.choosing #b-roll .badge{background:var(--accent-soft);color:var(--accent)}
.actions.final #b-roll{display:none}
.badge{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.22);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
#b-roll.waiting:disabled{opacity:1;background:var(--surface);border-color:var(--line);color:var(--muted)}

/* end */
#s-end{justify-content:space-between}
.end-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:0}
#e-title{font-size:19px;font-weight:700;color:var(--muted);margin:0}
.e-score{font-size:88px;font-weight:800;letter-spacing:-.045em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;margin:6px 0 2px}
#e-sub{margin:6px 0 22px;font-weight:700;min-height:1.2em}
.e-list{list-style:none;padding:0;margin:0;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);text-align:left;overflow-y:auto}
.e-list li{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;font-weight:700}
.e-list li + li{border-top:1px solid var(--line)}
.e-list li.me{color:var(--accent)}
.e-list b{font-variant-numeric:tabular-nums}
.end-btns{display:grid;gap:10px;margin-top:16px}
#e-wait{text-align:center;margin:0 0 4px}

/* rules */
.lead{font-size:16px;line-height:1.55;margin:2px 2px 6px;font-weight:500}
.rules h3{font-size:15px;font-weight:800;color:var(--muted);margin:20px 4px 8px}
.rl{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.rl li{display:grid;grid-template-columns:1fr auto;column-gap:14px;row-gap:5px;padding:14px 16px;align-items:center}
.rl li + li{border-top:1px solid var(--line)}
.rl .nm{font-weight:800;font-size:16px}
.rl .ds{color:var(--muted);font-size:14px;font-weight:500;line-height:1.4;grid-column:1}
.rl .ex{display:flex;gap:4px;grid-column:1;margin-top:3px}
.rl .pts{grid-column:2;grid-row:1/span 3;font-weight:800;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums;text-align:right}

/* overlays */
.sheet{position:fixed;inset:0;background:rgba(10,14,22,.42);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20;opacity:0;transition:opacity .2s}
.sheet.on{opacity:1}
.sheet-card{background:var(--surface);border-radius:var(--r-lg);padding:22px 18px 16px;width:100%;max-width:480px;transform:translateY(18px);transition:transform .24s cubic-bezier(.3,.7,.3,1)}
.sheet.on .sheet-card{transform:none}
.sheet h3{margin:0 0 6px;font-size:19px;font-weight:800;padding:0 4px}
.sheet p{margin:0 0 18px;color:var(--muted);line-height:1.45;font-weight:500;padding:0 4px}
.sheet-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center;line-height:1.35}
.pill.on{opacity:1;transform:translate(-50%,0)}
#conn{top:calc(env(safe-area-inset-top,0px) + 56px);background:var(--accent-soft);color:var(--ink)}

/* table themes */
:root[data-table="felt"]{--table-base:#1E5A46;--table-bg:radial-gradient(130% 150% at 50% 0%,#2A7359 0%,#1E5A46 55%,#174A39 100%)}
:root[data-table="wood"]{--table-base:#5B3B22;--table-bg:repeating-linear-gradient(91deg,rgba(255,255,255,.04) 0 2px,rgba(255,255,255,0) 2px 11px),repeating-linear-gradient(89deg,rgba(0,0,0,.08) 0 1px,rgba(0,0,0,0) 1px 17px),linear-gradient(180deg,#6E472A,#563720)}
/* pace */
.row.sum .val.pace-v{font-weight:800}
.row.sum .val.pos{color:var(--accent)}
.row.sum .val.neg{color:var(--danger)}
/* stats */
.stat-hero{text-align:center;padding:10px 0 18px}
.stat-big{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.stat-hero .muted{margin-top:4px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:1fr 1fr}
.stat{padding:14px 16px;display:grid;gap:3px}
.stat:nth-child(even){border-left:1px solid var(--line)}
.stat:nth-child(n+3){border-top:1px solid var(--line)}
.stat b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.spark-box{padding:14px 16px}
.spark-h{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:10px}
.spark{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:100px;padding-top:18px}
.spark i{flex:1;min-width:0;max-width:30px;border-radius:5px 5px 2px 2px;background:var(--accent-soft);position:relative}
.spark i.top{background:var(--accent)}
.spark i span{position:absolute;left:50%;top:-17px;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--muted);font-style:normal;font-variant-numeric:tabular-nums}
/* scorecards */
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:15px;padding:12px 8px 2px}
.cards-card{max-height:calc(100% - 24px);display:flex;flex-direction:column}
.cards-scroll{overflow:auto;margin:4px -4px 14px;-webkit-overflow-scrolling:touch;min-height:0}
.ctbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ctbl th,.ctbl td{padding:6px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.ctbl th:first-child,.ctbl td:first-child{text-align:left;color:var(--muted);font-weight:600;position:sticky;left:0;background:var(--surface)}
.ctbl thead th{border-top:0;font-weight:800;max-width:76px;overflow:hidden;text-overflow:ellipsis}
.ctbl tr.sub td{background:var(--surface-2)}
.ctbl tr.tot td{font-weight:800;font-size:15px;color:var(--ink)}
.ctbl .me{color:var(--accent)}
/* undo */
.pill.undo{border:0;white-space:nowrap;width:max-content;display:flex;gap:14px;align-items:center;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.pill.undo.on{pointer-events:auto}
.pill.undo b{color:var(--accent-soft);font-weight:800}
@media (max-height:640px){
  .gbar{min-height:44px}
  #g-turn{font-size:17px}
  .pad{margin:6px 0 8px}
  .col{grid-template-rows:repeat(9,minmax(28px,1fr))}
  .row{font-size:13.5px}
  .row .val{font-size:15.5px}
  .row .mini{width:17px;height:17px;padding:2.5px}
  .row .mini .pip{width:3px;height:3px}
  .tray{--ds:clamp(36px,10.5vw,44px)}
  .actions{margin-top:8px}
  #b-roll,#b-score{padding:12px}
  .hero{gap:18px}
}
@media (orientation:landscape) and (max-height:540px){
  #app{max-width:920px}
  #s-menu{flex-direction:row;align-items:center;gap:28px;padding-bottom:14px}
  #s-menu .hero{gap:14px}
  #s-menu .menu{flex:1;max-width:400px}
  .hero h1{font-size:54px}
  #s-game{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:16px}
  #s-game .gbar,#g-players{grid-column:1/-1}
  #pad{grid-column:1;grid-row:3/5;margin:6px 0 0}
  #tray{grid-column:2;grid-row:3;align-self:end}
  #g-actions{grid-column:2;grid-row:4}
  .col{grid-template-rows:repeat(9,minmax(26px,1fr))}
  .end-wrap{overflow-y:auto;justify-content:flex-start;padding-top:8px}
  .e-score{font-size:64px}
}
@media (prefers-reduced-motion:reduce){
  .tray.pending .die .d3,.row.ink,.row.ink .val{animation:none}
  .screen{transform:none!important}
}
/* chat */
.gbar.mp{grid-template-columns:88px 1fr 88px}
.gbar-r{display:flex;justify-content:flex-end}
.chat-btn{position:relative}
.cbadge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;line-height:17px;text-align:center}
#l-chat{width:100%;margin-top:14px}
.chat-sheet{align-items:flex-start}
.chat-card{display:flex;flex-direction:column;max-height:min(70vh,560px);padding-bottom:14px}
.chat-head{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 8px}
.chat-head h3{margin:0}
.chat-list{flex:1;min-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.chat-empty{color:var(--muted);text-align:center;margin:auto;font-weight:600;font-size:14px}
.msg{max-width:82%;align-self:flex-start;background:var(--surface-2);border-radius:14px 14px 14px 4px;padding:7px 11px;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.msg b{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:1px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink,#0b1020);border-radius:14px 14px 4px 14px}
.chat-row{display:flex;gap:8px;margin-top:8px}
.chat-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px}
.chat-row .btn{padding:12px 16px}
/* desktop & large screens: phones (narrow, or short landscape) are unaffected */
@media (min-width:900px) and (min-height:600px){
  #app{max-width:1180px}
  .screen{padding:20px 32px 28px}
  #s-menu{flex-direction:row;align-items:center;justify-content:center;gap:clamp(56px,9vw,128px);padding-bottom:28px}
  #s-menu .hero{flex:0 1 auto;gap:36px}
  .hero h1{font-size:112px}
  .menu-tray{--ds:56px}
  #s-menu .menu{width:420px;flex:none}
  #s-mp>.bar,#s-lobby>.bar,#s-stats>.bar,#s-settings>.bar,#s-rules>.bar,#l-start,#s-end>.end-wrap,#s-end>.end-btns{width:100%;max-width:620px;margin-left:auto;margin-right:auto}
  .screen>.scroll{padding-left:max(16px,calc(50% - 294px));padding-right:max(16px,calc(50% - 294px))}
  #s-game{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,440px);grid-template-rows:auto minmax(0,1fr) auto;column-gap:32px;padding-top:14px}
  #s-game .gbar{grid-column:1/-1}
  #pad{grid-column:1;grid-row:2/4;margin:10px 0 0}
  #g-players{grid-column:2;grid-row:2;align-self:start;flex-wrap:wrap;overflow:visible;margin-top:10px;padding:0}
  #tray{grid-column:2;grid-row:2;align-self:end;--ds:66px}
  #g-actions{grid-column:2;grid-row:3}
  .col{grid-template-rows:repeat(9,minmax(40px,1fr))}
  .row{font-size:16px;padding:0 16px}
  .row .val{font-size:19px}
  #g-turn{font-size:22px}
  #g-round{font-size:14px}
  .chip{max-width:240px}
  .sheet{align-items:center}
}
</style>
</head>
<body>
<div id="app">

  <section class="screen on" id="s-menu">
    <div class="hero">
      <div class="menu-tray" id="menu-tray" aria-hidden="true"></div>
      <h1>Yatzy</h1>
    </div>
    <nav class="menu" data-ta="mainMenu">
      <div id="m-resume"></div>
      <button class="mbtn primary" type="button" data-act="solo"><span data-t="solo"></span><small data-t="soloSub"></small></button>
      <button class="mbtn" type="button" data-go="mp"><span data-t="mp"></span><small data-t="mpSub"></small></button>
      <div class="mrow">
        <button class="mbtn sm" type="button" data-go="rules"><span data-t="rules"></span></button>
        <button class="mbtn sm" type="button" data-go="stats"><span data-t="stats"></span></button>
        <button class="mbtn sm" type="button" data-go="settings"><span data-t="settings"></span></button>
      </div>
    </nav>
  </section>

  <section class="screen" id="s-mp">
    <header class="bar"><button class="icon-btn" type="button" data-go="menu" data-ta="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-t="mp"></h2><span></span></header>
    <div class="scroll">
      <p class="notice" id="mp-notice" data-t="notice" hidden></p>
      <div class="group" style="margin-bottom:0">
        <label class="field"><span data-t="yourName"></span><input class="txt" id="mp-name" maxlength="16" data-tp="player" autocomplete="nickname" enterkeyhint="done"></label>
      </div>
      <div class="mp-block">
        <h3 data-t="hostTitle"></h3>
        <p class="muted" data-t="hostSub"></p>
        <button class="btn primary full" type="button" id="mp-host" data-t="hostBtn"></button>
      </div>
      <div class="mp-block">
        <h3 data-t="joinTitle"></h3>
        <p class="muted" data-t="joinSub"></p>
        <div class="join-row">
          <input class="code-in" id="mp-code" maxlength="5" placeholder="ABCDE" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" data-ta="roomCode">
          <button class="btn" type="button" id="mp-join" data-t="join"></button>
        </div>
        <p class="err" id="mp-err" role="alert"></p>
      </div>
    </div>
  </section>

  <section class="screen" id="s-lobby">
    <header class="bar"><button class="icon-btn" type="button" id="l-back" data-ta="leave"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="l-title"></h2><span></span></header>
    <div class="scroll">
      <div class="code-card"><span class="cl" data-t="roomCode"></span><div class="code" id="l-code"></div><button class="btn" type="button" id="l-copy" data-t="copy"></button></div>
      <p class="status" id="l-status" aria-live="polite"></p>
      <ul class="plist" id="l-players"></ul>
      <button class="btn" type="button" id="l-chat"></button>
    </div>
    <button class="btn primary full" type="button" id="l-start" data-t="start"></button>
  </section>

  <section class="screen" id="s-game">
    <header class="gbar">
      <button class="icon-btn" type="button" id="g-exit" data-ta="leaveGame"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="gtitle" aria-live="polite"><div id="g-turn"></div><div id="g-round"></div></div>
      <div class="gbar-r"><button class="icon-btn chat-btn" type="button" id="g-chat" data-ta="chat" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5a7.5 7.5 0 0 1-11 6.6L4 20l1-4.4A7.5 7.5 0 1 1 20 12.5z"/></svg><span class="cbadge" id="g-chat-n" hidden></span></button><button class="icon-btn" type="button" id="g-mute"></button></div>
    </header>
    <div class="chips" id="g-players" hidden></div>
    <div class="pad" id="pad"><div class="col" id="col-up"></div><div class="col" id="col-low"></div></div>
    <div class="tray" id="tray"></div>
    <div class="actions" id="g-actions">
      <button class="btn primary" type="button" id="b-roll"><span id="b-roll-l"></span><span class="badge" id="b-badge">3</span></button>
      <button class="btn primary" type="button" id="b-score"></button>
    </div>
    <div id="fx" aria-hidden="true"></div>
  </section>

  <section class="screen" id="s-end">
    <div class="end-wrap">
      <h2 id="e-title"></h2>
      <div class="e-score" id="e-score"></div>
      <p id="e-sub"></p>
      <ol class="e-list" id="e-list"></ol>
      <button class="linkbtn" type="button" id="e-cards"></button>
    </div>
    <div class="end-btns">
      <p class="muted" id="e-wait" data-t="waitAgain" hidden></p>
      <button class="btn primary full" type="button" id="e-again" data-t="playAgain"></button>
      <button class="btn full" type="button" id="e-menu"></button>
    </div>
  </section>

  <section class="screen" id="s-stats">
    <header class="bar"><button class="icon-btn" type="button" data-go="menu" data-ta="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-t="statsTitle"></h2><span></span></header>
    <div class="scroll">
      <div class="stat-hero"><div class="stat-big" id="st-best">0</div><div class="muted" data-t="bestScore"></div></div>
      <div class="group stat-grid">
        <div class="stat"><b id="st-games"></b><span data-t="played"></span></div>
        <div class="stat"><b id="st-avg"></b><span data-t="avg"></span></div>
        <div class="stat"><b id="st-bonus"></b><span data-t="bonusRate"></span></div>
        <div class="stat"><b id="st-yatzy"></b><span data-t="yatzys"></span></div>
      </div>
      <div class="group spark-box" id="st-spark-box"><div class="spark-h" data-t="lastGames"></div><div class="spark" id="st-spark"></div></div>
      <div class="group spark-box" id="st-online"><div class="spark-h" data-t="online"></div>

/* ---------- scoring ---------- */
function counts(d){const c=[0,0,0,0,0,0,0];for(const v of d)c[v]++;return c;}
function scoreFor(ci,d){
  const c=counts(d), sum=d.reduce((a,b)=>a+b,0);

  if(sc[9]==null){const v=c.findIndex(x=>x>=4);if(v>0)return {cat:9,dice:all.filter(i=>d[i]===v)};}

}

  sc.forEach((v,i)=>{if(i<6){up+=v||0;maxUp+=v==null?(i+1)*5:v;}else low+=v||0;});

  return {up,bonus,low,total:up+bonus+low,maxUp};

/* ---------- game engine ---------- */

  g.h=h; g.d=g.d.map((v,i)=>h[i]?v:d6()); g.rl--; g.ri++; return true;

  if(g.ph!=='play'||g.rl===3||g.rl===0)return false;

function applyScore(g,c){
  if(g.ph!=='play'||g.rl===3||!Number.isInteger(c)||c<0||c>14)return false;

function parseG(v){
  if(typeof v==='string'){try{return JSON.parse(v);}catch(e){return null;}}
  return v&&typeof v==='object'?v:null; // backward-compat with old object form
}
function publish(){
  const g=st.g,r=st.room; if(!g||!r)return;
  r.presence({r:'h',v:1,n:myName(),pid:st.myKey,g:JSON.stringify(g)}).catch(()=>{});
  if(g.ph==='play'||g.ph==='lobby')store.set('yz.host',{code:st.code,g,ts:Date.now()}); else store.del('yz.host');
}
async function hostGame(saved){
  if(st.busy)return; st.busy=true; setBusy(true); mpErr('');
  try{
    const room=await roomP; if(!room){noOnline();return;}
    const key=await mpKey();
    let code,g;
    if(saved){code=saved.code;g=cleanState(saved.g);if(!g||!CODE_RE.test(code)){store.del('yz.host');renderMenu();return;}g.pl[0].pid=key;}
    else{code=genCode();g={v:1,ph:'lobby',code,pl:[{pid:key,n:myName()}],t:0,rd:1,d:[1,2,3,4,5],h:[0,0,0,0,0],rl:3,ri:0,sc:[],last:null};}
    let nr; try{nr=await room.join(roomName(code));}catch(e){console.error('[Yatzy] room.join failed:',e);go('mp');mpErr(roomErrMsg(e));return;}
    teardown(); st.mode='host'; st.myKey=key; st.code=code; st.g=g; st.room=nr; st.present=new Set([key]);
    st.noOnline=false;
    nr.onPeers(ch=>{if(st.room===nr)onPeersHost(ch);},()=>roomLost(nr));
    nr.onConnection(c=>connState(nr,c));
    connState(nr, nr.connected());
    publish(); route();
  }catch(e){console.error('[Yatzy] hostGame crashed:',e);}
  finally{st.busy=false;setBusy(false);}
}
async function joinGame(raw){
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!CODE_RE.test(code)){go('mp');mpErr(t('errCode'));return;}
  if(st.busy)return; st.busy=true; setBusy(true); mpErr('');
  try{
    const room=await roomP; if(!room){noOnline();return;}
    const key=await mpKey();
    let nr; try{nr=await room.join(roomName(code));}catch(e){go('mp');mpErr(roomErrMsg(e));return;}
    teardown(); st.mode='guest'; st.myKey=key; st.code=code; st.g=null; st.room=nr;
    store.set('yz.guest',{code,ts:Date.now()});
    if(/^#join-/i.test(location.hash||'')){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
    nr.presence({r:'g',v:1,n:myName(),pid:key,a:null}).catch(()=>{});
    st.noOnline=false;
    nr.onPeers(ch=>{if(st.room===nr)onPeersGuest(ch);},()=>roomLost(nr));
    nr.onConnection(c=>connState(nr,c));
    connState(nr, nr.connected());
    st.joinT=setTimeout(()=>{if(st.room===nr&&!st.g){store.del('yz.guest');teardown();go('mp');mpErr(t('errNoGame',code));}},8000);
    go('lobby');
  }finally{st.busy=false;setBusy(false);}
}
function peerKey(p){const pr=p.presence||{};return p.by||(typeof pr.pid==='string'&&pr.pid?pr.pid.slice(0,80):null);}
function onPeersHost(ch){
  ingestChat(ch.peers);
  const g=st.g; if(!g)return;
  const pres=new Set([st.myKey]); let changed=false;
  for(const p of ch.peers){
    if(p.isMe)continue;
    const pr=p.presence||{}; if(pr.r!=='g')continue;
    const key=peerKey(p); if(!key)continue; pres.add(key);
    if(st.g.ph==='lobby'){
      const ex=st.g.pl.find(x=>x.pid===key), nm=cleanName(pr.n);
      if(!ex&&st.g.pl.length<MAXP){st.g.pl.push({pid:key,n:nm});changed=true;}
      else if(ex&&ex.n!==nm){ex.n=nm;changed=true;}
    }
    const a=pr.a;
    if(a&&typeof a==='object'&&st.g.ph==='play'){
      const idx=st.g.pl.findIndex(x=>x.pid===key);
      if(idx===st.g.t&&a.ri===st.g.ri){
        if(a.k==='hold')changed=applyHold(st.g,a.h)||changed;
        else if(a.k==='roll')changed=applyRoll(st.g,a.h)||changed;
        else if(a.k==='score')changed=applyScore(st.g,a.c)||changed;
      }
    }
  }
  if(st.g.ph==='lobby'){const n=st.g.pl.length;st.g.pl=st.g.pl.filter(x=>pres.has(x.pid));if(st.g.pl.length!==n)changed=true;}
  const ps=[...pres].sort().join('|'), pchg=ps!==st.presSig; st.present=pres; st.presSig=ps;
  if(changed)commit(); else if(pchg&&(cur==='game'||cur==='lobby'))go(cur);   // redraw only if someone came or went
}
function onPeersGuest(ch){
  ingestChat(ch.peers);
  const pres=new Set(); let host=null, hostG=null;
  for(const p of ch.peers){
    const k=peerKey(p); if(k)pres.add(k);
    const pr=p.presence||{};
    if(!p.isMe&&!host&&pr.r==='h'){
      const pg=parseG(pr.g);
      if(pg&&pg.code===st.code){host=p;hostG=pg;}
    }
  }
  st.present=pres;
  if(!host){
    if(st.g&&!st.hostGoneT&&!st.hostGone)st.hostGoneT=setTimeout(()=>{st.hostGoneT=0;if(!st.room)return;st.hostGone=true;showConn(t('hostGone'));if(cur==='game')renderGame();},3500);
    return;
  }
  clearTimeout(st.hostGoneT); st.hostGoneT=0;
  const wasGone=st.hostGone;
  if(st.hostGone){st.hostGone=false;hideConn();}
  const g=cleanState(hostG); if(!g)return;
  clearTimeout(st.joinT); st.joinT=0;
  if(g.ph==='closed'){store.del('yz.guest');teardown();go('menu');toast(t('hostEnded'));return;}
  // Skip the redraw when the game and the player list are exactly as last time
  // (chat messages and connection pings also trigger updates).
  const gj=JSON.stringify(g), ps=[...pres].sort().join('|');
  if(st.g&&!wasGone&&gj===st.lastGJ&&ps===st.presSig)return;
  st.lastGJ=gj; st.presSig=ps;
  st.g=g; route();
}
function sendAct(a){if(!st.room)return;st.seq++;a.s=st.seq;st.room.presence({a}).catch(()=>{});}
function setPending(){
  st.pending=true; clearTimeout(st.pendT);
  st.pendT=setTimeout(()=>{if(st.pending){st.pending=false;renderGame();toast(t('noResp'));}},6000);
  renderGame();
}
function closeHosting(){
  if(st.g&&st.room){st.g.ph='closed';st.room.presence({g:JSON.stringify(st.g)}).catch(()=>{});}
  store.del('yz.host'); teardown(700); go('menu');
}
function leaveGuest(){store.del('yz.guest');teardown();go('menu');}

/* ---------- actions ---------- */
function toggleHold(i){
  const g=st.g; if(!myTurn()||st.pending||g.rl===3||g.rl===0)return;
  st.myHeld[i]=st.myHeld[i]?0:1; sfx.tick();
  if(st.myHeld[i]&&!keptOnce){keptOnce=true;store.set('yz.kept',true);}
  if(st.mode==='guest'){sendAct({k:'hold',ri:g.ri,h:st.myHeld.slice()});renderGame();}
  else{applyHold(g,st.myHeld);commit();}
}
function doRoll(){
  const g=st.g; if(!myTurn()||st.pending||g.rl===0||Date.now()<st.revealAt)return;
  const held=g.rl===3?[0,0,0,0,0]:st.myHeld.slice(); if(held.every(Boolean))return;
  if(st.mode==='guest'){sendAct({k:'roll',ri:g.ri,h:held});setPending();return;}
  if(st.undo)hideUndo();
  if(applyRoll(g,held))commit();
}
function doScore(c){
  const g=st.g; if(!myTurn()||st.pending||g.rl===3||g.sc[g.t][c]!=null)return;
  if(st.mode==='guest'){sendAct({k:'score',ri:g.ri,c});setPending();return;}
  if(st.mode==='solo'){const snap=JSON.parse(JSON.stringify(g));if(applyScore(g,c)){if(g.ph==='play')showUndo(snap,c,g.sc[0][c]);else hideUndo();commit();}return;}
  if(applyScore(g,c))commit();
}
function pickRow(c){
  const g=st.g; if(!myTurn()||st.pending||g.rl===3||g.sc[g.t][c]!=null)return;
  if(st.sel===c){doScore(c);return;}
  st.sel=c; sfx.tick(); renderGame();
}

function renderGame(){
  if(cur!=='game')return;
  const g=st.g; if(!g||(g.ph!=='play'&&g.ph!=='end'))return;
  const mp=st.mode!=='solo', me=myTurn(), prev=st.shown;
  $('#g-chat').hidden=!mp; $('#s-game .gbar').classList.toggle('mp',mp);
  const lastKey=g.last?g.last.ri:0;
  const newRi=!!prev&&prev.ri!==g.ri;
  if(!prev||newRi){st.myHeld=g.h.slice();st.sel=null;}
  if(newRi){st.pending=false;clearTimeout(st.pendT);}
  if(!prev||prev.t!==g.t||prev.rd!==g.rd)st.viewIdx=null;
  const rolled=newRi&&g.rl<3&&g.ph==='play';
  const scored=!!prev&&!!g.last&&prev.lastKey!==lastKey;
  if(rolled){st.viewHold=null;clearTimeout(st.vhT);}
  if(scored){
    st.ink={p:g.last.p,c:g.last.c,until:Date.now()+1100};
    sfx.score();
    if(mp&&g.last.p!==g.t){st.viewHold={idx:g.last.p};clearTimeout(st.vhT);st.vhT=setTimeout(()=>{st.viewHold=null;renderGame();},1300);}
  }
  const vi=st.viewHold&&st.viewHold.idx<g.pl.length?st.viewHold.idx:(st.viewIdx!=null&&st.viewIdx<g.pl.length?st.viewIdx:g.t);
  const ap=g.pl[g.t]||g.pl[0];
  const inGame=g.pl.some(p=>p.pid===st.myKey);

  // header
  const tEl=$('#g-turn'),rEl=$('#g-round');
  if(g.ph==='end'){tEl.textContent=t('gameOver');rEl.textContent='';}
  else if(!mp){tEl.textContent=t('round',g.rd,ROUNDS);rEl.textContent='';}
  else{tEl.textContent=me?t('yourTurn'):t('turnOf',ap.n);rEl.textContent=t('round',g.rd,ROUNDS)+(inGame?'':t('watching'));}
  renderMute();

  // players
  const chips=$('#g-players');
  if(mp){
    const sl=chips.scrollLeft; chips.hidden=false; chips.textContent='';
    g.pl.forEach((p,i)=>{
      const b=document.createElement('button'); b.type='button'; b.dataset.i=i;
      const away=!st.present.has(p.pid);
      b.className='chip'+(i===g.t&&g.ph==='play'?' active':'')+(i===vi?' viewing':'')+(away?' away':'');
      const dot=document.createElement('span');dot.className='dot';
      const nm=document.createElement('span');nm.textContent=p.pid===st.myKey?t('you'):p.n;
      const tt=document.createElement('b');tt.textContent=totals(g.sc[i]).total;
      b.append(dot,nm,tt); b.setAttribute('aria-label',t('ptsAria',nm.textContent,tt.textContent,away));
      chips.appendChild(b);
    });
    chips.scrollLeft=sl;
  }else chips.hidden=true;

  // dice
  const tray=gameTray.el;
  const heldNow=[0,1,2,3,4].map(i=>!!((me?st.myHeld[i]:g.h[i])&&g.rl<3&&g.ph==='play'));
  if(rolled&&gameTray.compact){gameTray.compact=false;tray.classList.remove('last');}
  if(rolled){
    const maxDur=gameTray.roll(g.d,heldNow);
    sfx.roll(heldNow.filter(x=>!x).length);
    if(maxDur>0){const ms=maxDur*1000*.82;st.revealAt=Date.now()+ms;clearTimeout(st.revT);st.revT=setTimeout(()=>{st.revT=0;renderGame();},ms+10);}
    if(g.d.every(v=>v===g.d[0])){clearTimeout(st.celeT);st.celeT=setTimeout(()=>{st.celeT=0;celebrate();},maxDur*1000*.82+(g.rl===0?480:80));}
  }
  const now=Date.now(), settling=now<st.revealAt;
  const final=g.ph==='play'&&g.rl===0&&!settling;
  const showHeld=final?[false,false,false,false,false]:heldNow;
  if(gameTray.compact!==final)gameTray.setCompact(final,g.d,showHeld,!!prev);
  else if(!rolled)gameTray.sync(g.d,showHeld,!!prev);
  gameTray.dice.forEach((d,i)=>{
    d.el.disabled=!(me&&g.rl>0&&g.rl<3)||st.pending||settling;
    d.el.setAttribute('aria-label',t('dieShowing',g.d[i],showHeld[i]));
    d.el.setAttribute('aria-pressed',String(showHeld[i]));
  });
  tray.classList.toggle('idle',g.rl===3&&g.ph==='play');
  tray.classList.toggle('pending',!!st.pending);
  tray.classList.toggle('hint',!keptOnce&&me&&g.ph==='play'&&g.rl>0&&g.rl<3&&!settling&&!st.pending&&!heldNow.some(Boolean));

  // scorecard
  const sc=g.sc[vi]||Array(15).fill(null);
  const live=g.ph==='play'&&vi===g.t&&g.rl<3&&!st.viewHold&&!settling;
  const canPick=me&&live&&!st.pending;
  const spot=set.spots&&live&&g.rl>0?goodHand(g.d,sc):null;
  rows.forEach((r,c)=>{
    const v=sc[c]; let txt='',cls='row';
    if(v!=null){
      txt=v; cls+=' filled';
      if(r.lock) r.lock.style.display='inline';
    } else {
      if(r.lock) r.lock.style.display='none';
      if(live&&(set.hints||(canPick&&st.sel===c)||(spot&&spot.cat===c))){const p=scoreFor(c,g.d);txt=p;cls+=p?' hint':' hint zero';}
    }
    if(canPick&&st.sel===c&&v==null)cls+=' sel';
    else if(live&&g.rl===0&&v==null&&fits(c,g.d))cls+=' fit';
    else if(spot&&spot.cat===c)cls+=' spot';
    if(st.ink&&st.ink.p===vi&&st.ink.c===c&&now<st.ink.until)cls+=' ink';
    r.val.textContent=txt; if(r.el.className!==cls)r.el.className=cls;
    r.el.disabled=!(canPick&&v==null);
    r.el.setAttribute('aria-label',cat(c)+(txt!==''?', '+txt:''));
  });
  gameTray.dice.forEach((d,i)=>d.el.classList.toggle('combo',!!spot&&spot.dice.includes(i)));
  const T=totals(sc);
  sumVals[0].innerHTML='<b>'+T.up+'</b> / 63';
  let par=0,anyUp=false; for(let i=0;i<6;i++)if(sc[i]!=null){par+=3*(i+1);anyUp=true;}
  const pace=T.up-par;
  if(T.bonus){sumVals[1].textContent='+50';sumVals[1].className='val earned';}
  else if(T.maxUp<63){sumVals[1].textContent='0';sumVals[1].className='val';}
  else if(anyUp){sumVals[1].textContent=pace>0?'+'+pace:pace<0?'\u2212'+(-pace):'\u00B10';sumVals[1].className='val pace-v'+(pace>0?' pos':pace<0?' neg':'');}
  else{sumVals[1].textContent=t('toGo',63);sumVals[1].className='val pend';}
  sumVals[2].textContent=T.total;

  // actions
  const roll=$('#b-roll'),score=$('#b-score'),acts=$('#g-actions'),badge=$('#b-badge'),rl=$('#b-roll-l');
  const choosing=canPick&&st.sel!=null;
  acts.classList.toggle('choosing',choosing);
  acts.classList.toggle('final',choosing&&g.rl===0);
  roll.classList.toggle('waiting',!me||g.rl===0);
  if(g.ph!=='play'){rl.textContent=t('gameOver');badge.hidden=true;roll.disabled=true;}
  else if(!me){rl.textContent=st.hostGone?t('waitHost'):t('isPlaying',ap.n);badge.hidden=true;roll.disabled=true;}
  else if(g.rl===0){rl.textContent=t('chooseBox');badge.hidden=true;roll.disabled=true;}
  else{rl.textContent=t('roll');badge.hidden=false;badge.textContent=g.rl;roll.disabled=st.pending||(g.rl<3&&st.myHeld.every(Boolean));}
  roll.setAttribute('aria-label',me&&g.ph==='play'&&g.rl>0?t('rollLeft',g.rl):rl.textContent);
  if(choosing)score.textContent=t('score',scoreFor(st.sel,g.d));
  score.disabled=!choosing||st.pending;

  if(mp&&me&&g.ph==='play'&&prev&&!prev.mine){sfx.turn();toast(t('yourTurn'));}
  st.shown={ri:g.ri,t:g.t,rd:g.rd,lastKey,mine:me};
}

/* ---------- render: end ---------- */
function renderEnd(){
  const g=st.g; if(!g)return;
  const solo=st.mode==='solo', host=st.mode==='host';
  const list=g.pl.map((p,i)=>({p,T:totals(g.sc[i])})).sort((a,b)=>b.T.total-a.T.total);
  const top=list[0], tie=list.length>1&&list[1].T.total===top.T.total;
  const ol=$('#e-list'); ol.textContent='';
  const row=(a,b,cls)=>{const li=document.createElement('li');if(cls)li.className=cls;const x=document.createElement('span');x.textContent=a;const y=document.createElement('b');y.textContent=b;li.append(x,y);ol.appendChild(li);};
  if(solo){
    $('#e-title').textContent=t('finalScore'); $('#e-score').textContent=top.T.total;
    $('#e-sub').textContent=st.newBest?t('newBest'):t('best',Math.max(st.prevBest|0,top.T.total));
    row(t('topHalf'),top.T.up); row(t('bonus'),top.T.bonus); row(t('bottomHalf'),top.T.low);
  }else{
    $('#e-title').textContent=tie?t('tie'):(top.p.pid===st.myKey?t('youWin'):t('wins',top.p.n));
    $('#e-score').textContent=top.T.total; $('#e-sub').textContent='';
    list.forEach((x,k)=>row((k+1)+'. '+(x.p.pid===st.myKey?t('you'):x.p.n),x.T.total,x.p.pid===st.myKey?'me':''));
    const mine=list.find(x=>x.p.pid===st.myKey);
    if(mine&&st.code){const S=loadStats(),key=st.code+':'+g.ri;if(S.ok!==key){S.ok=key;S.og++;if(mine.T.total===top.T.total)S.ow++;saveStats(S);}}
  }
  $('#e-cards').textContent=solo?t('viewCard'):t('viewCards');
  $('#e-again').hidden=!(solo||host);
  $('#e-wait').hidden=solo||host;
  $('#e-menu').textContent=solo?t('menu'):host?t('endGame'):t('leave');
}

/* ---------- stats ---------- */
function loadStats(){
  const s=store.get('yz.stats',null), o=s&&typeof s==='object'?s:{}, n=x=>Math.max(0,Math.floor(+x)||0);
  const S={games:n(o.games),sum:n(o.sum),best:n(o.best),bonus:n(o.bonus),yatzy:n(o.yatzy),og:n(o.og),ow:n(o.ow),ok:typeof o.ok==='string'?o.ok.slice(0,40):'',
    last:Array.isArray(o.last)?o.last.map(n).slice(-12):[]};
  const old=store.get('yz.best',0)|0; if(old>S.best)S.best=old;
  return S;
}
function saveStats(S){store.set('yz.stats',S);}
function renderStats(){
  const S=loadStats(), has=S.games>0;
  $('#st-best').textContent=S.best;
  $('#st-games').textContent=S.games;
  $('#st-avg').textContent=has?Math.round(S.sum/S.games):'\u2013';
  $('#st-bonus').textContent=has?Math.round(100*S.bonus/S.games)+'\u00A0%':'\u2013';
  $('#st-yatzy').textContent=S.yatzy;
  const sp=$('#st-spark'); sp.textContent='';
  $('#st-spark-box').hidden=S.last.length<2;
  const mx=Math.max(1,...S.last);
  S.last.forEach(v=>{const i=document.createElement('i');i.style.height=Math.max(6,Math.round(100*v/mx))+'%';if(v===mx)i.className='top';const l=document.createElement('span');l.textContent=v;i.appendChild(l);sp.appendChild(i);});
  $('#st-online').hidden=!S.og; $('#st-og').textContent=S.og; $('#st-ow').textContent=S.ow;
  $('#st-empty').hidden=has; $('#st-reset-box').hidden=!(has||S.og||S.best);
}

/* ---------- undo (solo) ---------- */
function showUndo(snap,c,pts){
  st.undo=snap; $('#undo-t').textContent=cat(c)+': '+pts; $('#undo-b').textContent=t('undo');
  $('#undo').classList.add('on'); clearTimeout(st.undoT); st.undoT=setTimeout(hideUndo,4500);
}
function hideUndo(){st.undo=null;clearTimeout(st.undoT);$('#undo').classList.remove('on');}
$('#undo').addEventListener('click',()=>{
  if(!st.undo||st.mode!=='solo'||cur!=='game')return hideUndo();
  const g=cleanState(st.undo); hideUndo(); if(!g)return;
  g.pl[0].pid='solo'; st.g=g; st.shown=null; st.sel=null; st.ink=null; sfx.tick(); commit();
});

/* ---------- scorecards sheet ---------- */
function showCards(){
  const g=st.g; if(!g)return;
  const tb=$('#cards-tbl'); tb.textContent='';
  const thead=document.createElement('thead'), hr=document.createElement('tr'); hr.appendChild(document.createElement('th'));
  g.pl.forEach(p=>{const th=document.createElement('th');th.textContent=p.pid===st.myKey?t('you'):p.n;if(p.pid===st.myKey)th.className='me';hr.appendChild(th);});
  thead.appendChild(hr); tb.appendChild(thead);
  const body=document.createElement('tbody'), Ts=g.sc.map(totals);
  const line=(label,vals,cls)=>{const tr=document.createElement('tr');if(cls)tr.className=cls;const td0=document.createElement('td');td0.textContent=label;tr.appendChild(td0);vals.forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(g.pl[i].pid===st.myKey)td.className='me';tr.appendChild(td);});body.appendChild(tr);};
  for(let c=0;c<6;c++)line(cat(c),g.sc.map(r=>r[c]==null?'\u2013':r[c]));
  line(t('sum'),Ts.map(x=>x.up),'sub'); line(t('bonus'),Ts.map(x=>x.bonus),'sub');
  for(let c=6;c<15;c++)line(cat(c),g.sc.map(r=>r[c]==null?'\u2013':r[c]));
  line(t('total'),Ts.map(x=>x.total),'tot');
  tb.appendChild(body);
  const sh=$('#cards'); sh.hidden=false; requestAnimationFrame(()=>requestAnimationFrame(()=>sh.classList.add('on')));
  $('#cards-close').focus();
}
function hideCards(){const sh=$('#cards');sh.classList.remove('on');setTimeout(()=>{sh.hidden=true;},220);}
$('#cards-close').addEventListener('click',hideCards);
$('#cards').addEventListener('click',e=>{if(e.target===e.currentTarget)hideCards();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#cards').hidden)hideCards();});

/* ---------- chat ----------
   Each player keeps their last 20 messages in a "ch" field of their own room
   entry, so the existing rules (write only your own entry) still apply. */
const cleanChat=x=>String(x==null?'':x).replace(/[\u0000-\u001F\u007F-\u009F\u00AD\u200B-\u200F\u2028-\u202E\u2060-\u206F\uFEFF]/g,'').replace(/\s+/g,' ').trim().slice(0,200);
function ingestChat(peers){
  let added=0;
  for(const p of peers){
    const pr=p.presence||{}; if(typeof pr.ch!=='string'||pr.ch.length>12000)continue;
    let arr=null; try{arr=JSON.parse(pr.ch);}catch(e){} if(!Array.isArray(arr))continue;
    for(const m of arr.slice(-20)){
      if(!m||!Number.isInteger(m.i)||typeof m.t!=='string'||typeof m.ts!=='number')continue;
      const k=p.by+':'+m.i; if(st.chat.has(k))continue;
      const t=cleanChat(m.t); if(!t)continue;
      st.chat.set(k,{n:cleanName(pr.n),t,ts:m.ts,me:!!p.isMe}); if(!p.isMe)added++;
    }
  }
  if(st.chat.size>150){const ks=[...st.chat.keys()];for(let i=0;i<st.chat.size-150;i++)st.chat.delete(ks[i]);}
  if(added){
    if($('#chat-sheet').hidden){st.chatUnread+=added;renderChatBadge();try{sfx.tick();}catch(e){}}
    else renderChat();
  }
}
function renderChatBadge(){
  const n=st.chatUnread,b=$('#g-chat-n');
  b.hidden=!n; b.textContent=n>9?'9+':String(n);
  $('#l-chat').textContent=t('chat')+(n?' ('+n+')':'');
}
function renderChat(){
  const list=$('#chat-list'); list.textContent='';
  const ms=[...st.chat.values()].sort((a,b)=>a.ts-b.ts);
  if(!ms.length){const e=document.createElement('div');e.className='chat-empty';e.textContent=t('chatEmpty');list.appendChild(e);return;}
  let last=null;
  for(const m of ms){
    const d=document.createElement('div'); d.className='msg'+(m.me?' me':'');
    if(!m.me&&m.n!==last){const b=document.createElement('b');b.textContent=m.n;d.appendChild(b);}
    d.appendChild(document.createTextNode(m.t)); list.appendChild(d); last=m.me?null:m.n;
  }
  list.scrollTop=list.scrollHeight;
}
function showChat(){
  if(!st.room)return;
  st.chatUnread=0; renderChatBadge(); renderChat();
  const sh=$('#chat-sheet'); sh.hidden=false; requestAnimationFrame(()=>requestAnimationFrame(()=>sh.classList.add('on')));
  setTimeout(()=>$('#chat-in').focus(),60);
}
function hideChat(now){
  const sh=$('#chat-sheet'); if(sh.hidden)return;
  sh.classList.remove('on'); $('#chat-in').blur();
  if(now)sh.hidden=true; else setTimeout(()=>{sh.hidden=true;},220);
}
function sendChat(){
  const inp=$('#chat-in'), v=cleanChat(inp.value);
  if(!v||!st.room||Date.now()-st.chatLast<500)return;
  st.chatLast=Date.now();
  const m={i:++st.chatSeq,t:v,ts:Date.now()};
  st.chatMine.push(m); if(st.chatMine.length>20)st.chatMine.shift();
  st.chat.set(st.myKey+':'+m.i,{n:myName(),t:v,ts:m.ts,me:true});
  st.room.presence({ch:JSON.stringify(st.chatMine)}).catch(()=>{});
  inp.value=''; renderChat();
}
$('#g-chat').addEventListener('click',showChat);
$('#l-chat').addEventListener('click',showChat);
$('#chat-close').addEventListener('click',()=>hideChat());
$('#chat-send').addEventListener('click',sendChat);
$('#chat-in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();sendChat();}});
$('#chat-sheet').addEventListener('click',e=>{if(e.target===e.currentTarget)hideChat();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#chat-sheet').hidden)hideChat();});
renderChatBadge();
$('#e-cards').addEventListener('click',showCards);

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=set.lang;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t);});
  document.querySelectorAll('[data-ta]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.ta));});
  document.querySelectorAll('[data-tp]').forEach(el=>{el.placeholder=t(el.dataset.tp);});
  rows.forEach((r,c)=>{r.nm.textContent=cat(c);});
  buildRules();
  if(!st.busy)setBusy(false);
  go(cur);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-act]'); if(!el)return;
  if(el.dataset.go){if(el.dataset.go==='mp')mpErr('');go(el.dataset.go);}
  else if(el.dataset.act==='solo')startSolo();
});
$('#b-roll').addEventListener('click',doRoll);
$('#b-score').addEventListener('click',()=>{if(st.sel!=null)doScore(st.sel);});
$('#g-mute').addEventListener('click',()=>{if(set.vol===0){set.vol=60;set.mute=false;}else set.mute=!set.mute;saveSet();renderMute();if(!set.mute)sfx.tick();});
$('#g-players').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b||!st.g)return;
  const g=st.g,i=+b.dataset.i,p=g.pl[i]; if(!p)return;
  if(st.mode==='host'&&g.ph==='play'&&b.classList.contains('away')&&i>0){
    ask({title:t('removeQ',p.n),text:t('removeT'),yes:t('remove'),no:t('wait')})
      .then(ok=>{if(ok&&st.g===g&&g.pl[i]===p&&removePlayer(g,i))commit();});
    return;
  }
  st.viewHold=null; st.viewIdx=(i===g.t||st.viewIdx===i)?null:i; renderGame();
});
$('#g-exit').addEventListener('click',async()=>{
  if(st.mode==='solo'){teardown();go('menu');return;}
  if(st.mode==='host'){if(await ask({title:t('endQ'),text:t('endT'),yes:t('endGame'),no:t('keepPlaying')}))closeHosting();return;}
  if(st.mode==='guest'){if(await ask({title:t('leaveQ'),text:t('leaveT'),yes:t('leave'),no:t('stay')}))leaveGuest();}
});
$('#l-back').addEventListener('click',async()=>{
  if(st.mode==='host'){if(await ask({title:t('closeQ'),text:t('closeT'),yes:t('closeGame'),no:t('stay')}))closeHosting();}
  else leaveGuest();
});
$('#l-start').addEventListener('click',()=>{
  const g=st.g; if(st.mode!=='host'||!g||g.ph!=='lobby'||g.pl.length<2)return;
  st.g=newGame(g.pl,st.code,g.ri); commit();
});
$('#l-copy').addEventListener('click',async()=>{
  const link=location.origin+location.pathname+'#join-'+st.code;
  try{await navigator.clipboard.writeText(link);toast(t('copied'));}catch(e){toast(t('yourCode',st.code));}
});
$('#e-again').addEventListener('click',()=>{
  if(st.mode==='solo')startSolo();
  else if(st.mode==='host'&&st.g){const g=st.g;const pl=g.pl.filter(p=>st.present.has(p.pid));st.g=newGame(pl.length?pl:[g.pl[0]],st.code,g.ri);commit();}
});
$('#e-menu').addEventListener('click',()=>{if(st.mode==='solo'){teardown();go('menu');}else if(st.mode==='host')closeHosting();else leaveGuest();});

$('#mp-host').addEventListener('click',()=>hostGame(null));
$('#mp-join').addEventListener('click',()=>joinGame($('#mp-code').value));
$('#mp-code').addEventListener('input',e=>{const v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);if(e.target.value!==v)e.target.value=v;mpErr('');});
$('#mp-code').addEventListener('keydown',e=>{if(e.key==='Enter')joinGame(e.target.value);});
function onName(e){set.name=e.target.value.slice(0,16);saveSet();}
$('#mp-name').addEventListener('input',onName);
$('#set-name').addEventListener('input',onName);
$('#set-vol').addEventListener('input',e=>{set.vol=+e.target.value;if(set.vol>0)set.mute=false;$('#set-vol-v').textContent=set.vol;saveSet();});
$('#set-vol').addEventListener('change',()=>sfx.tick());
$('#set-theme').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;set.theme=b.dataset.v;saveSet();applyTheme();renderSettings();});
$('#set-hints').addEventListener('change',e=>{set.hints=e.target.checked;saveSet();});
$('#set-spots').addEventListener('change',e=>{set.spots=e.target.checked;saveSet();});
$('#set-lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.v===set.lang)return;set.lang=b.dataset.v;saveSet();applyLang();});
$('#set-table').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;set.table=b.dataset.v;saveSet();applyTheme();renderSettings();});
$('#st-reset').addEventListener('click',async()=>{if(await ask({title:t('resetQ'),text:t('resetT'),yes:t('reset'),no:t('cancel')})){store.del('yz.stats');store.del('yz.best');renderStats();}});

function applyTheme(){const r=document.documentElement;if(set.theme==='light'||set.theme==='dark')r.setAttribute('data-app-theme',set.theme);else r.removeAttribute('data-app-theme');r.setAttribute('data-table',set.table);}

/* ---------- init ---------- */
applyTheme();
applyLang();
document.querySelectorAll('.screen').forEach(s=>{if(!s.classList.contains('on'))s.inert=true;});
roomP.then(r=>{if(!r){st.noOnline=true;if(cur==='mp')renderMp();}});
const hm=/^#join-([a-z0-9]{5})$/i.exec(location.hash||'');
if(hm&&CODE_RE.test(hm[1].toUpperCase())){st.prefill=hm[1].toUpperCase();go('mp');}
else renderMenu();
})();
</script>
